# Root dev/docs environment for the workspace. This is NOT a published package;
# it exists so `uv sync` provisions a reproducible environment (pinned by
# uv.lock) that builds the `can_motor_control` extension and installs the docs
# toolchain in one step. See the README "Documentation" section.
[project]
name = "can-motor-control-dev"
version = "0"
description = "Local dev/docs environment for can_motor_control (not published)."
requires-python = ">=3.10"
dependencies = [
    # The extension plus its `docs` extra (mkdocs-material, mkdocstrings) — the
    # crate's pyproject.toml is the single source of truth for the tool list.
    "can-motor-control[docs]",
    # Used by examples/02_read_single_motor.py and 06_read_openarm_motor.py for live TUIs.
    "rich>=13",
]

[tool.uv]
# This root project is an environment, not a distributable package.
package = false

[tool.uv.sources]
# Build the local extension editable, via maturin, as part of `uv sync`.
"can-motor-control" = { path = "crates/can-motor-control-py", editable = true }
