name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish Python distributions to PyPI"
        type: boolean
        default: false
      publish_crates:
        description: "Publish Rust crates to crates.io"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build_python_distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
      - name: Build wheel and sdist
        working-directory: crates/can-motor-control-py
        run: |
          rm -rf ../../target/wheels
          maturin build --release --strip --locked --compatibility pypi --sdist
      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: target/wheels/can_motor_control-*
          if-no-files-found: error

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build_python_distributions
    if: github.event_name == 'push' || inputs.publish_pypi
    environment:
      name: pypi
      url: https://pypi.org/project/can-motor-control/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish_crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates
    environment:
      name: crates-io
      url: https://crates.io/crates/can-motor-control
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run crates.io publishes
        run: |
          cargo publish --dry-run -p can-motor-codec
          cargo publish --dry-run -p can-motor-damiao-codec
          cargo publish --dry-run -p can-motor-control
      - name: Authenticate with crates.io trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p can-motor-codec
          cargo publish -p can-motor-damiao-codec
          cargo publish -p can-motor-control
