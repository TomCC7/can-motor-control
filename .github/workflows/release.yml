name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish Python distributions to PyPI"
        type: boolean
        default: false
      publish_crates:
        description: "Publish Rust crates to crates.io"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build_python_distributions:
    name: Build Python distributions (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - name: Assert macOS arm64 runner
        if: matrix.platform == 'macos-arm64'
        run: test "$(uname -m)" = arm64
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
      - name: Set Python distribution version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/can-motor-control-py
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          text = text.replace('dynamic = ["version"]', f'version = "{version}"')
          pyproject.write_text(text)
          PY
      - name: Build wheel
        working-directory: crates/can-motor-control-py
        run: |
          rm -rf ../../target/wheels
          maturin build --release --strip --locked --compatibility pypi
      - name: Build sdist on Linux
        if: matrix.platform == 'linux'
        working-directory: crates/can-motor-control-py
        run: maturin sdist --locked
      - name: Validate wheel in a clean environment
        run: |
          wheel=$(find target/wheels -name 'can_motor_control-*.whl' -print -quit)
          python -m venv /tmp/can-motor-control-release
          /tmp/can-motor-control-release/bin/pip install numpy "$wheel"
          /tmp/can-motor-control-release/bin/python -c "import can_motor_control as c, sys; native = 'GsUsbBus' if sys.platform == 'darwin' else 'SocketCanBus'; absent = 'SocketCanBus' if sys.platform == 'darwin' else 'GsUsbBus'; assert hasattr(c, native); assert not hasattr(c, absent)"
      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ matrix.platform }}
          path: target/wheels/can_motor_control-*
          if-no-files-found: error

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build_python_distributions
    if: github.event_name == 'push' || inputs.publish_pypi
    environment:
      name: pypi
      url: https://pypi.org/project/can-motor-control/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          path: dist
          merge-multiple: true
      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish_crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates
    environment:
      name: crates-io
      url: https://crates.io/crates/can-motor-control
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run crates.io publishes
        run: |
          cargo publish --dry-run -p can-motor-codec
          cargo publish --dry-run -p can-motor-damiao-codec
          cargo publish --dry-run -p can-motor-control
      - name: Authenticate with crates.io trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p can-motor-codec
          cargo publish -p can-motor-damiao-codec
          cargo publish -p can-motor-control
