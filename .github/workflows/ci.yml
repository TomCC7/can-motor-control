name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  no_std:
    name: motor-codec / damiao-codec no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p motor-codec --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p damiao-codec --no-default-features --target thumbv7em-none-eabihf

  vendor_isolation:
    name: can-motor-control has no vendor dep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confirm no vendor codec in can-motor-control runtime tree
        run: |
          if cargo tree -p can-motor-control --edges normal | grep -E '\bdamiao-codec\b|\brobostride\b|\bmyactuator\b'; then
            echo "::error::vendor codec leaked into can-motor-control runtime dependencies"
            exit 1
          fi

  wheel:
    name: maturin build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install maturin and numpy
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy pytest
      - name: Build wheel
        working-directory: crates/can-motor-control-py
        run: maturin build --release --strip
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: can_motor_control-wheel
          path: target/wheels/*.whl
      - name: Install wheel into a clean venv with only numpy
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install numpy
          /tmp/venv/bin/pip install target/wheels/*.whl
          /tmp/venv/bin/python -c "import can_motor_control; print(can_motor_control.__name__)"

  pytest:
    name: Python smoke tests
    runs-on: ubuntu-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install maturin and dev wheel
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy pytest
          cd crates/can-motor-control-py && maturin develop --release
      - name: Run pytest
        run: pytest tests/python -v
