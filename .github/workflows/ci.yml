name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  no_std:
    name: can-motor-codec / can-motor-damiao-codec no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p can-motor-codec --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p can-motor-damiao-codec --no-default-features --target thumbv7em-none-eabihf

  vendor_isolation:
    name: can-motor-control has no vendor dep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confirm no vendor codec in can-motor-control runtime tree
        run: |
          if cargo tree -p can-motor-control --edges normal | grep -E '\bcan-motor-damiao-codec\b|\brobostride\b|\bmyactuator\b'; then
            echo "::error::vendor codec leaked into can-motor-control runtime dependencies"
            exit 1
          fi

  wheel:
    name: maturin build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
      - name: Build wheel
        working-directory: crates/can-motor-control-py
        run: |
          rm -rf ../../target/wheels
          maturin build --release --strip --locked --compatibility pypi
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: can_motor_control-wheel
          path: target/wheels/can_motor_control-*.whl
          if-no-files-found: error
      - name: Install wheel into a clean venv with only numpy
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/pip install numpy
          /tmp/venv/bin/pip install target/wheels/can_motor_control-*.whl
          /tmp/venv/bin/python -c "import can_motor_control; print(can_motor_control.__name__)"

  pytest:
    name: Python smoke tests from wheel
    runs-on: ubuntu-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download built wheel
        uses: actions/download-artifact@v5
        with:
          name: can_motor_control-wheel
          path: wheelhouse
      - name: Install wheel test environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/pip install numpy pytest
          /tmp/venv/bin/pip install wheelhouse/*.whl
      - name: Run pytest
        run: /tmp/venv/bin/python -m pytest tests/python -v

  docs:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Build docs
        run: |
          uv sync --frozen --reinstall-package can-motor-control
          uv run --with mkdocs --with mkdocs-material --with 'mkdocstrings[python]' -- python -m mkdocs build --site-dir site
